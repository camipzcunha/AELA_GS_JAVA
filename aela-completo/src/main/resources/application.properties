# ═══════════════════════════════════════════════════════════════
# AELA — Configuração da Aplicação
# ═══════════════════════════════════════════════════════════════

# ── Servidor ─────────────────────────────────────────────────
server.port=8080
spring.application.name=aela-api

# ── Banco de Dados Oracle ─────────────────────────────────────
spring.datasource.url=jdbc:oracle:thin:@oracle.fiap.com.br:1521:orcl
spring.datasource.username=RM558768
spring.datasource.password=160106
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# Pool de conexões (HikariCP)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000

# ── JPA / Hibernate ───────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.OracleDialect

# ── Serialização JSON ─────────────────────────────────────────
spring.jackson.default-property-inclusion=non_null
spring.jackson.serialization.write-dates-as-timestamps=false

# ── Actuator ──────────────────────────────────────────────────
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
info.app.name=AELA API
info.app.description=Adaptive Extremes Life Analytics
info.app.version=1.0.0

# ── Log ───────────────────────────────────────────────────────
logging.level.br.com.aela=DEBUG
logging.level.org.hibernate.SQL=DEBUG

# ── NASA API ──────────────────────────────────────────────────
# Chave gratuita — registre a sua em https://api.nasa.gov/
# DEMO_KEY funciona para testes (30 req/hora, 50 req/dia)
nasa.api.key=DEMO_KEY

# ── Web Service SOAP ──────────────────────────────────────────
# WSDL disponível em: http://localhost:8080/ws/aela.wsdl
# Endpoints SOAP em:  http://localhost:8080/ws/
